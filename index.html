<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>扫雷 | Minesweeper</title>
  <style>
    :root {
      --ink: #edf5ff;
      --muted: #8ca3bd;
      --line: #273c55;
      --panel: #112238;
      --panel-2: #0e1d31;
      --bg: #071321;
      --cyan: #66e4dc;
      --yellow: #ffd166;
      --red: #ff6b7d;
      --blue: #61a8ff;
      --green: #70e1a1;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(circle at 50% -10%, #173457 0%, var(--bg) 46%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .app { width: min(100%, 980px); margin: 0 auto; padding: 36px 22px 50px; }
    .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .eyebrow { margin: 0 0 7px; color: var(--cyan); font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 46px); line-height: 1; font-weight: 700; }
    .tagline { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
    .new-game { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 16px; border: 1px solid #3a5b78; border-radius: 7px; color: var(--ink); background: #17304b; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: border-color .15s, background .15s, transform .15s; }
    .new-game:hover { border-color: var(--cyan); background: #1d3c5e; }
    .new-game:active { transform: translateY(1px); }
    .new-game span { color: var(--cyan); font-size: 18px; line-height: 1; }

    .shell { border: 1px solid var(--line); border-radius: 11px; background: rgba(14, 29, 49, .86); box-shadow: 0 20px 60px rgba(0,0,0,.2); overflow: hidden; }
    .toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 20px; padding: 18px 20px; border-bottom: 1px solid var(--line); background: rgba(17, 34, 56, .72); }
    .difficulty-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
    .difficulty { display: flex; flex-wrap: wrap; gap: 5px; }
    .difficulty button { min-height: 32px; padding: 0 12px; border: 1px solid transparent; border-radius: 5px; color: var(--muted); background: transparent; font: inherit; font-size: 13px; cursor: pointer; }
    .difficulty button:hover { color: var(--ink); background: #1a314b; }
    .difficulty button.active { border-color: #39746f; color: #0c2726; background: var(--cyan); font-weight: 700; }
    .stats { display: flex; align-items: center; gap: 24px; }
    .stat { min-width: 64px; }
    .stat-label { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .stat-value { font-variant-numeric: tabular-nums; font-size: 24px; line-height: 1; font-weight: 700; }
    .stat-value.mines { color: var(--yellow); }
    .stat-value.time { color: var(--blue); }

    .game-area { padding: 22px 20px 24px; }
    .status-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 22px; margin-bottom: 14px; color: var(--muted); font-size: 13px; }
    .status-line strong { color: var(--ink); font-weight: 600; }
    .hint { color: #6d849e; font-size: 12px; }
    .board-scroll { max-width: 100%; overflow-x: auto; padding: 2px 2px 8px; }
    .board { --cell: clamp(23px, 4.4vw, 34px); display: grid; grid-template-columns: repeat(var(--cols), var(--cell)); grid-auto-rows: var(--cell); width: max-content; margin: 0 auto; border: 5px solid #1e334b; background: #1e334b; box-shadow: 0 10px 24px rgba(0,0,0,.25); }
    .cell { display: grid; place-items: center; width: var(--cell); height: var(--cell); padding: 0; border: 1px solid #2c4560; color: var(--ink); background: #1a3049; font: inherit; font-size: clamp(13px, 2.5vw, 18px); font-weight: 700; line-height: 1; cursor: pointer; user-select: none; }
    .cell:hover:not(.revealed) { background: #244461; }
    .cell:focus-visible { outline: 2px solid var(--cyan); outline-offset: -3px; z-index: 1; }
    .cell.revealed { border-color: #1e334b; background: #0d1f34; cursor: default; }
    .cell.flagged { color: var(--yellow); background: #26364a; }
    .cell.mine { color: #101b2b; background: var(--red); }
    .cell.mine.hit { box-shadow: inset 0 0 0 3px #ffd6dc; }
    .cell.wrong { color: var(--red); background: #2a2537; }
    .n1 { color: var(--blue); } .n2 { color: var(--green); } .n3 { color: var(--red); } .n4 { color: #b795ff; } .n5 { color: #ff9d66; } .n6 { color: #6ee7d1; } .n7 { color: #f1f5f9; } .n8 { color: #95a9bf; }
    .footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; padding-top: 16px; margin-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .footer kbd { padding: 2px 5px; border: 1px solid #3a5069; border-radius: 3px; color: var(--ink); background: #142b45; font: inherit; font-size: 11px; }

    @media (max-width: 620px) {
      .app { padding: 24px 12px 32px; }
      .topbar { align-items: flex-start; flex-direction: column; gap: 16px; }
      .new-game { align-self: stretch; justify-content: center; }
      .toolbar { grid-template-columns: 1fr; gap: 16px; padding: 16px; }
      .stats { justify-content: space-between; }
      .game-area { padding: 18px 10px 18px; }
      .status-line { align-items: flex-start; flex-direction: column; gap: 4px; }
      .board { --cell: clamp(24px, 8.3vw, 32px); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">经典益智游戏</p>
        <h1>扫雷</h1>
        <p class="tagline">清除所有安全方格，避开隐藏的地雷。</p>
      </div>
      <button class="new-game" id="newGame" type="button" aria-label="开始新游戏"><span aria-hidden="true">↻</span> 新游戏</button>
    </header>

    <section class="shell" aria-label="扫雷游戏">
      <div class="toolbar">
        <div>
          <span class="difficulty-label">选择难度</span>
          <div class="difficulty" role="group" aria-label="难度">
            <button type="button" data-level="beginner">初级 <small>9×9</small></button>
            <button type="button" data-level="intermediate">中级 <small>16×16</small></button>
            <button type="button" data-level="expert">高级 <small>30×16</small></button>
          </div>
        </div>
        <div class="stats" aria-live="polite">
          <div class="stat"><span class="stat-label">剩余地雷</span><span class="stat-value mines" id="mineCount">10</span></div>
          <div class="stat"><span class="stat-label">用时</span><span class="stat-value time" id="timer">000</span></div>
        </div>
      </div>

      <div class="game-area">
        <div class="status-line"><span id="status"><strong>准备开始</strong> · 点击任意方格</span><span class="hint">右键标记地雷</span></div>
        <div class="board-scroll"><div class="board" id="board" role="grid" aria-label="扫雷棋盘"></div></div>
        <div class="footer"><span>目标：揭开全部安全方格</span><span><kbd>鼠标左键</kbd> 揭开　<kbd>鼠标右键</kbd> 标记</span></div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const levels = {
        beginner: { label: '初级', rows: 9, cols: 9, mines: 10 },
        intermediate: { label: '中级', rows: 16, cols: 16, mines: 40 },
        expert: { label: '高级', rows: 16, cols: 30, mines: 99 }
      };
      const boardEl = document.getElementById('board');
      const mineCountEl = document.getElementById('mineCount');
      const timerEl = document.getElementById('timer');
      const statusEl = document.getElementById('status');
      const newGameBtn = document.getElementById('newGame');
      let level = 'beginner';
      let state;
      let timerId;

      function seededBoard(rows, cols, mineTotal, safeIndex) {
        const total = rows * cols;
        const mines = new Set();
        while (mines.size < mineTotal) {
          const pick = Math.floor(Math.random() * total);
          if (pick !== safeIndex) mines.add(pick);
        }
        return Array.from({ length: total }, (_, index) => ({ mine: mines.has(index), revealed: false, flagged: false, adjacent: 0 }));
      }

      function neighbors(index) {
        const { rows, cols } = state.config;
        const row = Math.floor(index / cols), col = index % cols;
        const result = [];
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const rr = row + dr, cc = col + dc;
          if (rr >= 0 && rr < rows && cc >= 0 && cc < cols) result.push(rr * cols + cc);
        }
        return result;
      }

      function buildMineCounts() {
        state.cells.forEach((cell, index) => { cell.adjacent = neighbors(index).filter(i => state.cells[i].mine).length; });
      }

      function newGame(nextLevel = level) {
        stopTimer();
        level = nextLevel;
        state = { config: levels[level], cells: null, started: false, ended: false, won: false, elapsed: 0, flags: 0 };
        state.cells = seededBoard(state.config.rows, state.config.cols, state.config.mines, -1);
        boardEl.style.setProperty('--cols', state.config.cols);
        boardEl.setAttribute('aria-rowcount', state.config.rows);
        boardEl.setAttribute('aria-colcount', state.config.cols);
        buildMineCounts();
        render();
        document.querySelectorAll('.difficulty button').forEach(button => button.classList.toggle('active', button.dataset.level === level));
        setStatus('<strong>准备开始</strong> · 点击任意方格');
      }

      function startGame(safeIndex) {
        if (state.started) return;
        const { rows, cols, mines } = state.config;
        const flaggedIndexes = state.cells.reduce((indexes, cell, index) => {
          if (cell.flagged && index !== safeIndex) indexes.push(index);
          return indexes;
        }, []);
        state.cells = seededBoard(rows, cols, mines, safeIndex);
        flaggedIndexes.forEach(index => { state.cells[index].flagged = true; });
        buildMineCounts();
        state.started = true;
        timerId = setInterval(() => { state.elapsed++; timerEl.textContent = String(state.elapsed).padStart(3, '0'); }, 1000);
      }

      function reveal(index) {
        if (state.ended || state.cells[index].flagged || state.cells[index].revealed) return;
        if (!state.started) startGame(index);
        const cell = state.cells[index];
        if (cell.mine) return lose(index);
        const queue = [index], visited = new Set();
        while (queue.length) {
          const current = queue.shift();
          if (visited.has(current)) continue;
          visited.add(current);
          const item = state.cells[current];
          if (item.flagged || item.mine) continue;
          item.revealed = true;
          if (item.adjacent === 0) neighbors(current).forEach(i => { if (!visited.has(i)) queue.push(i); });
        }
        render();
        checkWin();
      }

      function toggleFlag(index) {
        if (state.ended || state.cells[index].revealed) return;
        const cell = state.cells[index];
        if (!cell.flagged && state.flags >= state.config.mines) return;
        cell.flagged = !cell.flagged;
        state.flags += cell.flagged ? 1 : -1;
        render();
      }

      function lose(hitIndex) {
        state.ended = true;
        state.won = false;
        stopTimer();
        state.cells.forEach(cell => { if (cell.mine) cell.revealed = true; });
        render(hitIndex);
        setStatus('<strong class="lose-text">踩到地雷了</strong> · 再试一次吧');
      }

      function checkWin() {
        const safeLeft = state.cells.some(cell => !cell.mine && !cell.revealed);
        if (safeLeft) return;
        state.ended = true;
        state.won = true;
        stopTimer();
        state.cells.forEach(cell => { if (cell.mine && !cell.flagged) cell.flagged = true; });
        state.flags = state.config.mines;
        render();
        setStatus('<strong class="win-text">恭喜通关！</strong> · 用时 ' + String(state.elapsed).padStart(3, '0') + ' 秒');
      }

      function render(hitIndex) {
        mineCountEl.textContent = String(Math.max(0, state.config.mines - state.flags)).padStart(2, '0');
        timerEl.textContent = String(state.elapsed).padStart(3, '0');
        boardEl.innerHTML = '';
        state.cells.forEach((cell, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'cell';
          button.setAttribute('role', 'gridcell');
          button.setAttribute('aria-rowindex', Math.floor(index / state.config.cols) + 1);
          button.setAttribute('aria-colindex', index % state.config.cols + 1);
          if (cell.revealed) {
            button.classList.add('revealed');
            if (cell.mine) { button.classList.add('mine'); if (index === hitIndex) button.classList.add('hit'); button.textContent = '✹'; button.setAttribute('aria-label', '地雷'); }
            else if (cell.adjacent) { button.classList.add('n' + cell.adjacent); button.textContent = cell.adjacent; button.setAttribute('aria-label', cell.adjacent + ' 个相邻地雷'); }
            else button.setAttribute('aria-label', '空白安全方格');
          } else if (cell.flagged) { button.classList.add('flagged'); button.textContent = '⚑'; button.setAttribute('aria-label', '已标记方格'); }
          else button.setAttribute('aria-label', '未揭开方格');
          button.addEventListener('click', () => reveal(index));
          button.addEventListener('contextmenu', event => { event.preventDefault(); toggleFlag(index); });
          boardEl.appendChild(button);
        });
      }

      function setStatus(message) { statusEl.innerHTML = message; }
      function stopTimer() { if (timerId) { clearInterval(timerId); timerId = undefined; } }
      document.querySelectorAll('.difficulty button').forEach(button => button.addEventListener('click', () => newGame(button.dataset.level)));
      newGameBtn.addEventListener('click', () => newGame());
      newGame();
    })();
  </script>
</body>
</html>
